<style>
/* AGC brand colors (Brand Guidelines 2024). Swap here if the palette ever changes. */
:root{
  --grass:#319e59; --sand:#fff7d4; --forest:#12301d; --fairway:#1e5231;
  --yellow:#f2e266; --orange:#d86b3e; --birdie:#298cba;
  --ink:#12301d; --muted:#4d6656; --line:#e6dcb4; --card:#fffcec;
  --font:"Greycliff CF","Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--sand);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- Website ---------- */
.top{background:var(--forest);color:var(--sand);padding:18px 16px 0}
.top-inner{max-width:880px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand img{height:44px;width:auto;display:block}
.brand a{color:var(--sand);text-decoration:none;font-weight:600;font-size:14px;opacity:.85}
.hero{padding:18px 0 14px}
.hero h1{margin:0;font-size:30px;font-weight:900;letter-spacing:-.01em}
.hero p{margin:4px 0 0;color:#cfe3d4;font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:0;margin:0 -16px;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;color:#cfe3d4;padding:11px 14px 13px;font-weight:700;font-size:15px;border-radius:12px 12px 0 0;cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:var(--sand);color:var(--forest)}
main{max-width:880px;margin:0 auto;padding:16px 16px 40px}
.lg-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px;margin:4px 0 12px}
.lg-head h2{margin:0;font-size:24px;font-weight:900}
.status{font-size:13px;color:var(--muted);font-weight:600}
.status b{color:var(--fairway)}
.pill{display:inline-block;background:var(--yellow);color:var(--forest);font-weight:800;font-size:12px;padding:3px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.controls{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);padding:7px 12px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--grass);border-color:var(--grass);color:#fff}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .seg button{font-size:13px;padding:5px 10px}
.search{flex:1 1 180px;min-width:0;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;font:inherit;font-size:15px;color:var(--ink)}
.search:focus{outline:2px solid var(--grass);outline-offset:1px}
.board{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:hover{background:#fff8dc}
.row.head{cursor:default;background:var(--fairway);color:var(--sand);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:9px 14px}
.row.head:hover{background:var(--fairway)}
.rk{font-weight:900;font-size:18px;text-align:center}
.rk.top1{color:var(--forest);background:var(--yellow);border-radius:10px;padding:4px 0}
.nm{min-width:0}
.nm .t{font-weight:800;font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.nm .s{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
.stats{display:flex;gap:16px;text-align:right}
.stat .v{font-weight:900;font-size:19px}
.stat .l{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.row.head .stats{gap:16px}
.row.head .stat{min-width:44px}
.stat{min-width:44px}
.detail{grid-column:1/-1;display:none;padding:4px 0 2px}
.row.open .detail{display:block}
.wk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.wk{background:var(--sand);border-radius:10px;padding:7px 8px;text-align:center}
.wk .a{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}
.wk .b{font-size:17px;font-weight:900}
.wk .c{font-size:12px;color:var(--muted);font-weight:600}
.wk.na{opacity:.45}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-weight:600}
.note{font-size:13px;color:var(--muted);margin:10px 2px 0;line-height:1.45}
.records{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.rec{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.rec .c{font-size:12px;font-weight:800;color:var(--grass);text-transform:uppercase;letter-spacing:.06em}
.rec .r{font-size:28px;font-weight:900;margin:2px 0}
.rec .w{font-weight:800}
.rec .m{font-size:13px;color:var(--muted);font-weight:600}
footer{max-width:880px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:13px;line-height:1.5}
footer a{color:var(--fairway);font-weight:700}
.updated{font-size:12px;color:var(--muted);margin-top:8px}
@media (max-width:420px){.stats{gap:10px}.stat{min-width:38px}.stat .v{font-size:17px}.hero h1{font-size:26px}}

/* ---------- TV mode (16:9, scales with screen width) ---------- */
body.tv{background:var(--forest);color:var(--sand);overflow:hidden;cursor:none;font-size:1vw;height:100vh}
.tv-wrap{position:fixed;inset:0;display:flex;flex-direction:column}
.tv-bar{display:flex;align-items:center;justify-content:space-between;padding:1.4em 3em .6em}
.tv-bar img{height:3.6em}
.tv-clock{font-size:2.2em;font-weight:800;color:#cfe3d4}
.tv-stage{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0 3em;opacity:0;transition:opacity .8s ease;display:flex;flex-direction:column}
.slide.on{opacity:1}
.tv-foot{display:flex;align-items:center;justify-content:space-between;gap:2em;padding:.8em 3em 1.4em}
.tv-cta{display:flex;align-items:center;gap:1em;font-size:1.4em;font-weight:700;color:#cfe3d4}
.tv-cta b{color:var(--yellow)}
.qr{background:#fff;border-radius:.5em;padding:.35em;line-height:0}
.qr svg{width:100%;height:100%;display:block}
.tv-cta .qr{width:4.6em;height:4.6em}
.dots{display:flex;gap:.6em}
.dots i{width:1em;height:1em;border-radius:50%;background:#2c5a3c}
.dots i.on{background:var(--grass)}
.progress{position:fixed;left:0;bottom:0;height:.45em;background:var(--grass);width:0}
.s-kicker{font-size:1.45em;font-weight:800;color:var(--grass);text-transform:uppercase;letter-spacing:.08em}
.s-title{font-size:3.8em;font-weight:900;line-height:1;margin:.1em 0 .35em}
.s-title .pill{font-size:.32em;vertical-align:.7em;margin-left:.6em;padding:.25em .7em}
.tv-board{display:grid;gap:2em;align-content:start}
.tv-board.two{grid-template-columns:1fr 1fr}
.tv-col{display:flex;flex-direction:column;gap:.35em}
.tv-row{display:grid;grid-template-columns:2.8em 1fr 3.4em 3.4em;align-items:center;gap:.8em;background:var(--fairway);border-radius:.55em;padding:.32em .9em;font-size:1.55em}
.tv-row.h{background:none;padding:0 1.25em;font-size:.95em;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#9fc1aa}
.tv-row .r{font-weight:900;text-align:center}
.tv-row.lead{background:var(--grass)}
.tv-row.lead .r{background:var(--yellow);color:var(--forest);border-radius:.4em}
.tv-row .n{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-row .n small{font-size:.62em;margin-left:.7em;font-weight:600;color:#bcd6c4}
.tv-row.lead .n small{color:#e7f5ea}
.tv-row .p{font-weight:900;text-align:right;font-size:1.15em}
.tv-row .k{text-align:right;color:#cfe3d4;font-weight:700}
.tv-side{display:flex;gap:1.4em;margin-top:1em}
.chip{background:var(--fairway);border-radius:.7em;padding:.55em 1em;font-size:1.35em}
.chip .a{font-size:.7em;font-weight:800;color:var(--yellow);text-transform:uppercase;letter-spacing:.08em}
.chip .b{font-weight:800}
.promo{display:grid;grid-template-columns:1.3fr 1fr;gap:4em;align-items:center;height:100%}
.promo.noimg{grid-template-columns:1fr}
.promo h3{font-size:5.2em;font-weight:900;line-height:.98;margin:.15em 0 .25em}
.promo .when{font-size:2.1em;font-weight:800;color:var(--yellow);margin-bottom:.5em}
.promo .det{font-size:1.75em;line-height:1.35;color:#e9f1e6;max-width:30em}
.promo .go{display:flex;align-items:center;gap:1.2em;margin-top:1.6em;font-size:1.6em;font-weight:800}
.promo .go .qr{width:5.5em;height:5.5em}
.promo .go span b{color:var(--yellow);display:block}
.promo .img{height:100%;display:flex;align-items:center;justify-content:center;padding:1em 0}
.promo .img img{max-height:100%;max-width:100%;border-radius:1em;box-shadow:0 1.5em 4em rgba(0,0,0,.45)}
.tv-recs{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4em}
.tv-rec{background:var(--fairway);border-radius:1em;padding:1.3em 1.5em}
.tv-rec .c{font-size:1.4em;font-weight:800;color:var(--yellow);text-transform:uppercase;letter-spacing:.06em}
.tv-rec .r{font-size:3.2em;font-weight:900;line-height:1.1}
.tv-rec .w{font-size:1.8em;font-weight:800}
.tv-rec .m{font-size:1.4em;color:#bcd6c4;font-weight:600}

<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '

function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c=='"'){ if(t[i+1]=='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c=='"') q=true;
    else if(c==','){row.push(f);f="";}
    else if(c=='\n'||c=='\r'){ if(c=='\r'&&t[i+1]=='\n')i++; row.push(f);rows.push(row);row=[];f=""; }
    else f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows;
}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n==null?"–":(Math.round(n*10)/10).toString();
const DAYS={M:"Mon",MON:"Mon",MONDAY:"Mon",TU:"Tue",TUE:"Tue",TUES:"Tue",TUESDAY:"Tue",W:"Wed",WED:"Wed",WEDNESDAY:"Wed",TH:"Thu",THU:"Thu",THUR:"Thu",THURS:"Thu",THURSDAY:"Thu",F:"Fri",FRI:"Fri",FRIDAY:"Fri",SA:"Sat",SAT:"Sat",SATURDAY:"Sat",SU:"Sun",SUN:"Sun",SUNDAY:"Sun"};
const DAY_ORDER=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function slotInfo(s){
  s=clean(s); if(!s) return {night:null,label:""};
  const m=s.match(/^([A-Za-z]+)\.?\s*(.*)$/); let night=null,rest=s;
  if(m&&DAYS[m[1].toUpperCase()]){night=DAYS[m[1].toUpperCase()];rest=m[2];}
  rest=rest.replace(/(\d{1,2}:\d{2}):00/,"$1");
  return {night,label:(night?night+" ":"")+rest};
}

/* ---------------- League sheet → data ---------------- */
function parseLeague(csv, meta){
  const rows=parseCSV(csv);
  const hi=rows.findIndex(r=>r.some(c=>/^(TEAM|PLAYER)\s*NAME$/i.test(clean(c))));
  if(hi<0) return null;
  const H=rows[hi].map(clean);
  const col=re=>H.findIndex(h=>re.test(h));
  const iName=col(/^(TEAM|PLAYER)\s*NAME$/i), iNum=col(/^(TEAM|PLAYER)\s*#$/i), iSlot=col(/TIME\s*SLOT/i),
        iPts=col(/^TOTAL\s*POINTS/i), iStk=col(/^TOTAL\s*STROKES/i);
  const kind=/PLAYER/i.test(H[iName])?"player":"team";
  let title=meta.name;
  if(!title){for(let i=0;i<hi;i++){const c=rows[i].map(clean).find(x=>/leaderboard/i.test(x));if(c){title=c.replace(/\s*leaderboard\s*/i,"").trim();break;}}}
  const weeks={};
  H.forEach((h,i)=>{let m=h.match(/^WEEK\s*(\d+)\s*PTS\s*(?:\(([\d.]+)\s*x\))?/i);
    if(m){const n=+m[1];(weeks[n]=weeks[n]||{n}).pts=i;if(m[2])weeks[n].mult=+m[2];}
    m=h.match(/^WEEK\s*(\d+)\s*STROKES/i); if(m){const n=+m[1];(weeks[n]=weeks[n]||{n}).stk=i;}
  });
  const W=Object.values(weeks).filter(w=>w.stk!=null).sort((a,b)=>a.n-b.n);
  const entries=[];
  for(let r=hi+1;r<rows.length;r++){
    const row=rows[r], name=clean(row[iName]);
    if(!name||name==="0"||/=$/.test(name)) continue;
    if(iNum>=0&&num(row[iNum])==null) continue;
    const si=slotInfo(iSlot>=0?row[iSlot]:"");
    const wk={};let rounds=0,stSum=0;
    W.forEach(w=>{const s=num(row[w.stk]);if(s!=null&&s>0){wk[w.n]={pts:w.pts!=null?num(row[w.pts]):null,stk:s};rounds++;stSum+=s;}});
    entries.push({name,night:si.night,slot:si.label,total:iPts>=0?(num(row[iPts])??0):0,strokes:iStk>=0?(num(row[iStk])??stSum):stSum,wk,rounds,avg:rounds?stSum/rounds:null});
  }
  const played=W.filter(w=>entries.some(e=>e.wk[w.n]));
  const cur=played.length?played[played.length-1].n:0;
  const anyPts=entries.some(e=>e.total>0);
  const mode=anyPts?"points":(played.length?"strokes":"none");
  rank(entries,mode);
  const nights=[...new Set(entries.map(e=>e.night).filter(Boolean))].sort((a,b)=>DAY_ORDER.indexOf(a)-DAY_ORDER.indexOf(b));
  return {id:meta.id||slug(title),name:title,kind,mode,weeks:W.map(w=>({n:w.n,mult:w.mult||1})),played:played.map(w=>w.n),cur,entries,nights,site:meta.site!==false,tv:meta.tv!==false};
}
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
function rank(list,mode){
  if(mode==="points") list.sort((a,b)=>b.total-a.total||a.strokes-b.strokes||a.name.localeCompare(b.name));
  else list.sort((a,b)=>(a.avg??1e9)-(b.avg??1e9)||b.rounds-a.rounds||a.name.localeCompare(b.name));
  const key=e=>mode==="points"?e.total:(e.avg==null?null:Math.round(e.avg*10));
  list.forEach((e,i)=>{
    if(mode!=="points"&&e.avg==null){e.rank=null;e.rankLabel="–";return;}
    const k=key(e); const first=list.findIndex(x=>key(x)===k); const ties=list.filter(x=>key(x)===k).length;
    e.rank=first+1; e.rankLabel=(ties>1?"T":"")+(first+1);
  });
}
function weekList(L,n){
  const out=L.entries.filter(e=>e.wk[n]).map(e=>({...e,wpts:e.wk[n].pts,wstk:e.wk[n].stk}));
  const usePts=L.mode==="points"&&out.some(e=>e.wpts!=null);
  out.sort((a,b)=>usePts?((b.wpts??-1)-(a.wpts??-1)||a.wstk-b.wstk):a.wstk-b.wstk);
  const key=e=>usePts?e.wpts:e.wstk;
  out.forEach(e=>{const k=key(e);const f=out.findIndex(x=>key(x)===k);const t=out.filter(x=>key(x)===k).length;e.rankLabel=(t>1?"T":"")+(f+1);e.rank=f+1;});
  return {list:out,usePts,posted:out.length,total:L.entries.length};
}

/* ---------------- Promos / records ---------------- */
function rowsToObjects(csv){
  const rows=parseCSV(csv).filter(r=>r.some(c=>clean(c)));
  const hi=rows.findIndex(r=>r.filter(c=>clean(c)).length>=2);
  if(hi<0)return[];
  const H=rows[hi].map(h=>clean(h).toLowerCase());
  return rows.slice(hi+1).map(r=>{const o={};H.forEach((h,i)=>{if(h)o[h]=clean(r[i]);});return o;});
}
const pick=(o,...keys)=>{for(const k of keys){for(const ok in o){if(ok.startsWith(k)&&o[ok])return o[ok];}}return "";};
function parsePromos(csv){
  const today=new Date();today.setHours(0,0,0,0);
  return rowsToObjects(csv).map(o=>({headline:pick(o,"headline","title"),when:pick(o,"when","date"),details:pick(o,"details","description"),link:pick(o,"link","url","qr"),image:pick(o,"image"),start:pick(o,"start"),end:pick(o,"end"),show:pick(o,"show","active")}))
    .filter(p=>p.headline&&!/^n/i.test(p.show)&&(!p.start||new Date(p.start)<=new Date())&&(!p.end||new Date(p.end+" 23:59")>=today));
}
function parseRecords(csv){
  return rowsToObjects(csv).map(o=>({cat:o.category,who:o.player||o.team||"",team:o.player?o.team:"",course:o.course,season:o.season,rec:o.record})).filter(r=>r.cat&&r.rec);
}

/* ---------------- Data loading ---------------- */
let DATA={leagues:[],promos:[],records:[],updated:null,source:"snapshot"};
async function getText(url){let err;for(let i=0;i<4;i++){try{const r=await fetch(url+(url.includes("?")?"&":"?")+"_="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);return await r.text();}catch(e){err=e;await new Promise(z=>setTimeout(z,800*(i+1)));}}throw err;}
async function load(){
  if(!CONFIG.hubLeaguesCsv){
    DATA={leagues:SNAPSHOT.leagues.map(l=>parseLeague(l.csv,l)).filter(Boolean),promos:SNAPSHOT.promos,records:parseRecords(SNAPSHOT.records),updated:new Date(SNAPSHOT.asOf),source:"snapshot"};
    return;
  }
  const hub=rowsToObjects(await getText(CONFIG.hubLeaguesCsv));
  const metas=hub.map(o=>({name:pick(o,"league"),url:pick(o,"leaderboard","csv","link"),site:!/^n/i.test(pick(o,"website","site")),tv:!/^n/i.test(pick(o,"tv"))})).filter(m=>m.name&&m.url);
  const prev=DATA.source==="live"?DATA:{leagues:[],promos:[],records:[]};
  const leagues=(await Promise.all(metas.map(async m=>{try{return parseLeague(await getText(m.url),m);}catch(e){console.warn("league failed",m.name,e);return prev.leagues.find(l=>l.name===m.name)||null;}}))).filter(Boolean);
  let promos=prev.promos,records=prev.records;
  try{if(CONFIG.hubPromosCsv)promos=parsePromos(await getText(CONFIG.hubPromosCsv));}catch(e){console.warn(e);}
  try{if(CONFIG.recordsCsv)records=parseRecords(await getText(CONFIG.recordsCsv));}catch(e){console.warn(e);}
  if(!records.length)records=parseRecords(SNAPSHOT.records);
  DATA={leagues,promos,records,updated:new Date(),source:"live"};
}

/* ---------------- QR ---------------- */
function qrSvg(text){
  try{const q=qrcode(0,"M");q.addData(text.startsWith("http")?text:"https://"+text);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true});}catch(e){return "";}
}
const prettyUrl=u=>u.replace(/^https?:\/\/(www\.)?/,"").replace(/\/$/,"");

function leagueHTML(L){
  const views=[["overall","Standings"],...L.played.map(n=>[String(n),"Week "+n])];
  const cur=L.cur, wkCount=L.weeks.length;
  let status="";
  if(L.mode==="none") status="Season starting soon";
  else{const wl=weekList(L,cur);status=`Week <b>${cur}</b>`+(wl.posted<wl.total?` · ${wl.posted} of ${wl.total} ${L.kind==="team"?"teams":"players"} posted`:"");}
  let body="",note="";
  const filt=e=>(state.night==="all"||e.night===state.night)&&(!state.q||e.name.toLowerCase().includes(state.q.toLowerCase()));
  if(state.view==="overall"){
    const list=L.entries.filter(filt);
    const strokesMode=L.mode!=="points";
    const head=`<div class="row head"><div>Rank</div><div>${L.kind==="team"?"Team":"Player"}</div><div class="stats">${strokesMode?`<div class="stat">Rds</div><div class="stat">Avg</div>`:`<div class="stat">Pts</div><div class="stat">Strk</div>`}</div></div>`;
    body=head+(list.length?list.map(e=>rowHTML(L,e,strokesMode?[[e.rounds,"rds"],[e.avg==null?"–":fmt(e.avg),"avg"]]:[[fmt(e.total),"pts"],[e.strokes||"–","strk"]])).join(""):`<div class="empty">No match.</div>`);
    if(L.mode==="strokes") note="Points for this league haven't been posted yet, so it's ranked by average score for now.";
    if(L.mode==="points") note="Ranked by total points. Ties share a rank and are listed by fewest total strokes. Tap any "+(L.kind==="team"?"team":"player")+" for week-by-week results.";
  }else{
    const n=+state.view, wl=weekList(L,n), w=L.weeks.find(x=>x.n===n);
    const list=wl.list.filter(filt);
    const low=Math.min(...wl.list.map(e=>e.wstk));
    const head=`<div class="row head"><div>Wk ${n}</div><div>${L.kind==="team"?"Team":"Player"}</div><div class="stats">${wl.usePts?`<div class="stat">Pts</div>`:""}<div class="stat">Score</div></div></div>`;
    body=head+(list.length?list.map(e=>rowHTML(L,e,[...(wl.usePts?[[fmt(e.wpts),"pts"]]:[]),[e.wstk+(e.wstk===low?" ★":""),"score"]])).join(""):`<div class="empty">No scores posted yet.</div>`);
    note=`★ Low round of the week.`+(w&&w.mult>1?` Week ${n} counts ${w.mult}x points.`:"")+(wl.posted<wl.total?` ${wl.total-wl.posted} still to post.`:"");
  }
  return `<div class="lg-head"><h2>${esc(L.name)}</h2><div class="status">${status}</div></div>
  <div class="controls">
    ${views.length>1?`<div class="seg" role="group" aria-label="View">${views.map(([v,l])=>`<button data-view="${v}" aria-pressed="${state.view===v}">${l}</button>`).join("")}</div>`:""}
    <div class="filters">
      ${L.nights.length>1?`<div class="seg" role="group" aria-label="Night">${["all",...L.nights].map(n=>`<button data-night="${n}" aria-pressed="${state.night===n}">${n==="all"?"All nights":n}</button>`).join("")}</div>`:""}
      ${L.entries.length>8?`<input class="search" type="search" placeholder="Find your ${L.kind}…" value="${esc(state.q)}" aria-label="Search">`:""}
    </div>
  </div>
  <div class="board">${body}</div>
  ${note?`<p class="note">${note}</p>`:""}`;
}
function rowHTML(L,e,stats){
  const id=L.id+"|"+e.name, open=state.open.has(id);
  const detail=L.weeks.map(w=>{const d=e.wk[w.n];return `<div class="wk${d?"":" na"}"><div class="a">Wk ${w.n}${w.mult>1?" · "+w.mult+"x":""}</div><div class="b">${d?(L.mode==="points"&&d.pts!=null?fmt(d.pts)+" pts":d.stk):"–"}</div><div class="c">${d&&L.mode==="points"&&d.pts!=null?d.stk+" strokes":"&nbsp;"}</div></div>`;}).join("");

}
function recordsHTML(){

function buildSlides(){
  const leagues=DATA.leagues.filter(l=>l.tv&&l.mode!=="none");

  const out=[];let p=0;
  leagues.forEach((L,i)=>{out.push({type:"league",L});if(promos.length){out.push({type:"promo",P:promos[p%promos.length]});p++;}});
  if(DATA.records.length) out.push({type:"records"});
  while(p<promos.length){out.push({type:"promo",P:promos[p++]});}
  return out;
}

setInterval(async()=>{try{await load();isTV()?renderTV():(document.activeElement?.classList.contains("search")||renderSite());}catch(e){}},CONFIG.refreshMinutes*60000);
if(isTV()) setTimeout(()=>location.reload(),6*3600000); // fresh start every 6 hours on the TV
</script>
